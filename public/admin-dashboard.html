<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Redirecting...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      background-color: #f5f7fa;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      color: #3b82f6;
      margin-bottom: 16px;
    }
    p {
      max-width: 500px;
      margin-bottom: 20px;
      color: #333;
    }
  </style>
  <script>
    // Redirect to the React-based admin page immediately
    window.onload = function() {
      setTimeout(function() {
        window.location.href = '/admin';
      }, 1000); // Short delay to show the message
    };
  </script>
</head>
<body>
  <div class="loader"></div>
  <h1>Redirecting to Admin Dashboard</h1>
  <p>This page has been replaced with an improved React-based admin interface with Signals management functionality. You are being redirected automatically.</p>
  <p>If you are not redirected, <a href="/admin">click here</a> to go to the admin dashboard.</p>
</body>
</html>
