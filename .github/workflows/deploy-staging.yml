name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Type checking
        run: npm run typecheck

      - name: Linting
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.STAGING_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.STAGING_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.STAGING_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.STAGING_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.STAGING_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.STAGING_FIREBASE_APP_ID }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.STAGING_GOOGLE_BOOKS_API_KEY }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> $GITHUB_OUTPUT

      - name: Run performance audit on staging
        run: |
          npx lighthouse ${{ steps.deploy.outputs.preview_url }} --only-categories=performance --output=json --output-path=lighthouse-staging.json
          
      - name: Comment deployment details
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            const fs = require('fs');
            let perfScore = 'N/A';
            
            try {
              const lighthouse = JSON.parse(fs.readFileSync('lighthouse-staging.json', 'utf8'));
              perfScore = Math.round(lighthouse.categories.performance.score * 100);
            } catch (error) {
              console.log('Could not read lighthouse report');
            }
            
            const deploymentComment = `
            ## 🚀 Staging Deployment Complete
            
            **Preview URL**: ${{ steps.deploy.outputs.preview_url }}
            **Performance Score**: ${perfScore}/100
            **Branch**: \`${{ github.ref_name }}\`
            **Commit**: \`${{ github.sha }}\`
            
            ### Tests & Quality Checks
            - ✅ TypeScript compilation
            - ✅ ESLint checks  
            - ✅ Unit tests
            - ✅ Performance audit
            
            _Deployment completed at ${new Date().toISOString()}_
            `;
            
            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.repos.listCommentsForCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            
            const existingComment = comments.find(comment => 
              comment.body.includes('🚀 Staging Deployment Complete')
            );
            
            if (existingComment) {
              await github.rest.repos.updateCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: deploymentComment
              });
            } else {
              await github.rest.repos.createCommitComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                body: deploymentComment
              });
            }

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-performance
          path: lighthouse-staging.json
          retention-days: 30